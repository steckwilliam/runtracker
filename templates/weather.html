{% extends "base.html" %}

{% block title %}Weather Planner — RunTracker{% endblock %}

{% block content %}
<h1 class="mb-4">Weather Planner</h1>

<div class="card">
    <div class="card-body">
        <form>
            <div class="mb-3">
                <label for="minTemp" class="form-label">Minimum Temperature (°F)</label>
                <input type="number" class="form-control" id="minTemp" placeholder="e.g. 45">
            </div>
            <div class="mb-3">
                <label for="maxTemp" class="form-label">Maximum Temperature (°F)</label>
                <input type="number" class="form-control" id="maxTemp" placeholder="e.g. 65">
            </div>
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="rainAllowed">
                    <label class="form-check-label" for="rainAllowed">Rain allowed</label>
                </div>
            </div>
            <button type="button" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
